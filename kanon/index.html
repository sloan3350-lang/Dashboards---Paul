<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KANON</title>
<meta name="theme-color" content="#A8763E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KANON">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true" fill="none"
         stroke="currentColor" stroke-width="2.1" stroke-linecap="square">
      <path d="M2 22V2h20v20"/><path d="M7 22V7h10v10h-5v-5"/>
    </svg>
    <h1>Kanon</h1>
    <span class="sub">measured proportion</span>
    <span class="wk" id="weekBadge">Week 1</span>
    <button class="hbtn" id="themeBtn" type="button" aria-label="Switch colour theme"></button>
  </div>
</header>

<main>
  <!-- ============ TRAIN ============ -->
  <section id="v-train"></section>

  <!-- ============ DAILY ============ -->
  <section id="v-daily" hidden></section>

  <!-- ============ BODY ============ -->
  <section id="v-body" hidden></section>

  <!-- ============ PROGRESS ============ -->
  <section id="v-progress" hidden></section>

  <!-- ============ SETTINGS ============ -->
  <section id="v-settings" hidden></section>
</main>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-view="train" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M4 9v6M8 7v10M16 7v10M20 9v6M8 12h8"/></svg>Train</button>
  <button class="tab" role="tab" data-view="daily" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 3c3.5 4 6 6.7 6 10a6 6 0 0 1-12 0c0-3.3 2.5-6 6-10z"/></svg>Daily</button>
  <button class="tab" role="tab" data-view="body" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><path d="M12 7.4v7M12 14.4 8.5 21M12 14.4 15.5 21M7 10h10"/></svg>Body</button>
  <button class="tab" role="tab" data-view="progress" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 16l4-5 3 3 5-7"/></svg>Progress</button>
  <button class="tab" role="tab" data-view="settings" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>Settings</button>
</nav>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
