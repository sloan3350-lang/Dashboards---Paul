<title>Kanon</title>
<style>
/* KANON — marble & bronze. No webfonts: the app must render with zero network. */
:root{
  --bg:#F5F2EC; --surface:#FFFFFF; --surface2:#FAF8F3;
  --ink:#16181C; --muted:#6B6F76; --line:#E4DED2;
  --bronze:#A8763E; --bronze-soft:#F0E4D2;
  --good:#4F7A5B; --warn:#B07C2A; --bad:#A8433A;
  --shadow:0 1px 2px rgba(20,22,26,.06),0 4px 16px rgba(20,22,26,.05);
  --serif:"Iowan Old Style",Georgia,"Palatino Linotype",Palatino,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tabbar:64px; --on-bronze:#FFFFFF;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121317; --surface:#1B1D22; --surface2:#212429;
    --ink:#ECE7DD; --muted:#969CA5; --line:#2C2F36;
    --bronze:#C9A36A; --bronze-soft:#2A2419;
    --good:#7BAE86; --warn:#D2A354; --bad:#D4776B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); --on-bronze:#16181C;
  }
}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1B1D22; --surface2:#212429;
  --ink:#ECE7DD; --muted:#969CA5; --line:#2C2F36;
  --bronze:#C9A36A; --bronze-soft:#2A2419;
  --good:#7BAE86; --warn:#D2A354; --bad:#D4776B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.3); --on-bronze:#16181C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);
     -webkit-text-size-adjust:100%;padding-bottom:calc(var(--tabbar) + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
     padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:21px;letter-spacing:.18em;text-transform:uppercase}
.brand .sub{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.wk{margin-left:auto;font-size:12px;color:var(--bronze);border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;background:var(--surface)}

/* layout */
main{padding:16px;max-width:680px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
      padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.rule{height:1px;background:var(--line);margin:14px 0;border:0}

/* buttons */
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;
     padding:11px 14px;font-size:14px;font-weight:500;min-height:44px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:var(--on-bronze)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;min-height:36px;font-size:13px}
.btn.block{width:100%;justify-content:center;display:flex}
.btn[aria-pressed="true"]{background:var(--bronze-soft);border-color:var(--bronze);color:var(--bronze);font-weight:600}

/* exercise / set logging */
.ex{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;background:var(--surface)}
.ex.done{opacity:.62}
a.btn{color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.ex-h{display:flex;align-items:center;gap:10px;padding:13px 14px;background:var(--surface2)}
.ex-slot{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ex-name{font-family:var(--serif);font-size:16.5px;font-weight:600}
.ex-b{padding:12px 14px}
.target{font-size:13px;color:var(--muted);margin-bottom:10px}
.target b{color:var(--bronze);font-size:15px;font-family:var(--serif)}
.cue{font-size:12.5px;color:var(--muted);background:var(--surface2);border-left:2px solid var(--bronze);
     padding:8px 10px;border-radius:0 8px 8px 0;margin-bottom:12px}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr auto;gap:7px;align-items:center;margin-bottom:8px}
.setrow .n{font-size:11px;color:var(--muted);text-align:center}
input[type=number],input[type=text],input[type=date],select{
  width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:10px 8px;font:inherit;font-size:16px;text-align:center;min-height:44px}
input:focus,select:focus{outline:2px solid var(--bronze);outline-offset:-1px}
.lbl{font-size:10px;color:var(--muted);text-align:center;letter-spacing:.05em;text-transform:uppercase}

/* feedback choices */
.fb{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.fb .q{font-size:13.5px;font-weight:600;margin-bottom:7px}
.fb .qs{font-size:12px;color:var(--muted);font-weight:400;margin-bottom:7px}
.opts{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.opt{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:9px;
     padding:11px 12px;font-size:13.5px;min-height:44px;display:flex;align-items:center;gap:9px}
.opt[aria-pressed="true"]{background:var(--bronze-soft);border-color:var(--bronze);font-weight:600}
.opt .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.opt[aria-pressed="true"] .dot{background:var(--bronze)}
.opt.danger[aria-pressed="true"]{background:rgba(168,67,58,.1);border-color:var(--bad);color:var(--bad)}
.opt.danger[aria-pressed="true"] .dot{background:var(--bad)}
.jointgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.jointgrid .opt{justify-content:center;padding:10px 4px;font-size:12.5px}

/* alerts */
.alert{border-radius:10px;padding:12px 13px;font-size:13px;margin-bottom:12px;border:1px solid}
.alert.bad{background:rgba(168,67,58,.08);border-color:var(--bad);color:var(--bad)}
.alert.warn{background:rgba(176,124,42,.09);border-color:var(--warn);color:var(--warn)}
.alert.good{background:rgba(79,122,91,.09);border-color:var(--good);color:var(--good)}
.alert b{display:block;margin-bottom:3px;font-size:13.5px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.stat{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:12px 10px;text-align:center}
.stat .v{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.1}
.stat .k{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stat .d{font-size:11px;margin-top:3px}
.up{color:var(--bad)} .down{color:var(--good)}

/* bottles */
.bottles{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.bottle{width:38px;height:50px;border:2px solid var(--line);border-radius:5px 5px 9px 9px;
        background:var(--surface2);position:relative;padding:0}
.bottle::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);
                width:13px;height:7px;background:var(--line);border-radius:2px 2px 0 0}
.bottle.full{background:var(--bronze);border-color:var(--bronze)}
.bottle.full::before{background:var(--bronze)}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--surface);
      border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:10px;letter-spacing:.05em;
     text-transform:uppercase;color:var(--muted);min-height:var(--tabbar);
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab[aria-selected="true"]{color:var(--bronze);font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:26px 14px}
.tiny{font-size:11.5px;color:var(--muted);line-height:1.55}


/* --- artifact build: :root already carries the safe-area insets --- */
.top{top:0;padding-top:12px}
.tabs{padding-bottom:0}
html,body{background:var(--bg)}
</style>

<header class="top">
  <div class="brand">
    <h1>Kanon</h1>
    <span class="sub">measured proportion</span>
    <span class="wk" id="weekBadge">Week 1</span>
  </div>
</header>

<main>
  <!-- ============ TRAIN ============ -->
  <section id="v-train"></section>

  <!-- ============ DAILY ============ -->
  <section id="v-daily" hidden></section>

  <!-- ============ BODY ============ -->
  <section id="v-body" hidden></section>

  <!-- ============ PROGRESS ============ -->
  <section id="v-progress" hidden></section>

  <!-- ============ SETTINGS ============ -->
  <section id="v-settings" hidden></section>
</main>

<nav class="tabs" role="tablist">
  <button class="tab" role="tab" data-view="train" aria-selected="true">
    <svg viewBox="0 0 24 24"><path d="M4 9v6M8 7v10M16 7v10M20 9v6M8 12h8"/></svg>Train</button>
  <button class="tab" role="tab" data-view="daily" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M12 3c3.5 4 6 6.7 6 10a6 6 0 0 1-12 0c0-3.3 2.5-6 6-10z"/></svg>Daily</button>
  <button class="tab" role="tab" data-view="body" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><path d="M12 7.4v7M12 14.4 8.5 21M12 14.4 15.5 21M7 10h10"/></svg>Body</button>
  <button class="tab" role="tab" data-view="progress" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 16l4-5 3 3 5-7"/></svg>Progress</button>
  <button class="tab" role="tab" data-view="settings" aria-selected="false">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/></svg>Settings</button>
</nav>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
